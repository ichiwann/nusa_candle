name: CI/CD — Nusa Candle

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # TAHAP 1: Continuous Integration (Lint, Test & Asset Build)
  # ──────────────────────────────────────────────
  ci-testing:
    name: 🧪 1. Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Diperbarui dari 20 untuk menghindari warning deprecation
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: /root/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # --- PERBAIKAN 1: Setup Environment & App Key ---
      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # --- PERBAIKAN 2: Pastikan Database Test Siap ---
      - name: Setup Test Database
        run: php artisan migrate --force

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Run Test Suite (Pest / PHPUnit)
        run: php artisan test

  # ──────────────────────────────────────────────
  # TAHAP 2: Build & Push Container Image (GHCR)
  # ──────────────────────────────────────────────
  build-image:
    name: 🐳 2. Build & Push Image
    runs-on: ubuntu-latest
    needs: ci-testing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name (lowercase)
        id: image
        run: |
          NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # TAHAP 3: Deployment ke Server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 3. Deploy ke Server (Podman)
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 49218 }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            set -e

            IMAGE=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            echo "🔑 Login ke GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u $GITHUB_ACTOR --password-stdin

            echo "⬇️ Pulling image terbaru..."
            podman pull $IMAGE:latest

            echo "🔄 Updating container nusa-candle-app..."
            podman stop nusa-candle-app || true
            podman rm nusa-candle-app || true

            podman run -d \
              --name nusa-candle-app \
              --restart unless-stopped \
              --network voting-osis_default \
              -p 127.0.0.1:8000:8000 \
              --env-file /home/isaki/nusa_candle/.env.production \
              -v /home/isaki/nusa_candle/storage/app/public:/app/storage/app/public:rw \
              $IMAGE:latest

            podman image prune -f

            echo "🌐 Verifikasi service..."
            curl -I http://127.0.0.1:8000 || true

            echo "✅ Deployment selesai: https://nusacandle.neverlandstudio.web.id"
